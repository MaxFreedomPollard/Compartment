name: Publish to MCP Registry

# Publishes server.json to the official MCP registry
# (registry.modelcontextprotocol.io) whenever a GitHub Release is published,
# so the registry entry never drifts behind PyPI the way it did before this
# existed. Authentication is GitHub Actions OIDC: the registry checks this
# workflow's own identity token against the io.github.MaxFreedomPollard/*
# namespace it owns, so no token is stored anywhere. Same arrangement as the
# PyPI Trusted Publishing in publish.yml, for the same reason.

on:
  release:
    types: [published]
  # The registry rejects a version it already holds, so a manual run only does
  # something once server.json's version has moved on. That is the case when a
  # release went out before this workflow existed and only the registry entry
  # still needs to catch up.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # required for OIDC authentication to the registry

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      # Fail on a malformed server.json before touching the registry, rather
      # than half-way through a publish.
      - name: Validate server.json
        run: ./mcp-publisher validate

      # The registry checks that the PyPI version in server.json really
      # exists before it will register it, and publish.yml is uploading that
      # version to PyPI on the same trigger, in a sibling workflow this one
      # cannot wait on with `needs`. So it raced, lost, and every release
      # failed here with "version '<v>' was not found (status: 404)" while
      # PyPI was still processing the upload seconds later.
      - name: Wait for the version to reach PyPI
        run: |
          version=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          echo "waiting for compartment $version on PyPI"
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
                   "https://pypi.org/pypi/compartment/$version/json" || echo 000)
            if [ "$code" = "200" ]; then
              echo "compartment $version is on PyPI after $attempt attempt(s)"
              exit 0
            fi
            echo "attempt $attempt: PyPI answered $code"
            sleep 10
          done
          echo "::error::compartment $version never appeared on PyPI; \
          publish it first, then re-run this workflow"
          exit 1

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
