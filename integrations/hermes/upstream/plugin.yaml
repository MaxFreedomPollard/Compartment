# Bundled-in-hermes variant of plugin.yaml. Identical to
# ../compartment/plugin.yaml except pip_dependencies declares the engine, so
# `hermes memory setup` auto-installs compartment when the user selects
# Compartment in the picker. Use THIS file in the upstream PR.
name: compartment
version: 1.5.0
description: "Compartment: fully offline, AEAD-encrypted vector memory. No API key, no cloud. Locks itself on restart/power loss, per-caller namespaces, crypto-shred deletion, hybrid recall."
pip_dependencies:
  - "compartment>=1.5"
requires_env: []
hooks:
  - on_session_switch
