# Bundled-in-hermes variant of plugin.yaml. Identical to
# ../compartment/plugin.yaml except pip_dependencies declares the engine, so
# `hermes memory setup` auto-installs compartment when the user selects
# Compartment in the picker. Use THIS file in the upstream PR.
name: compartment
version: 1.7.0
description: "Compartment - high-security, fully offline, encrypted vector memory. AEAD-encrypted vault, locked-by-default after restart, native Hermes provider, no API key."
pip_dependencies:
  - "compartment>=2.3"
requires_env: []
hooks:
  - on_session_switch
